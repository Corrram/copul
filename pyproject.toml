[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copul"
version = "0.4.0"
description = "Copulas and dependence measures for research: symbolic and numerical copula families, checkerboard approximations, Chatterjee's xi and rank correlations, exact regions and optimisation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Marcus Rockel", email = "marcus.rockel@finance.uni-freiburg.de" },
]
keywords = [
    "copula",
    "copulas",
    "dependence",
    "dependence measures",
    "chatterjee",
    "rank correlation",
    "spearman",
    "kendall",
    "checkerboard copula",
    "statistics",
    "sympy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "sympy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
# Exact LP/QP optimisation over checkerboard copulas (copul.optim).
optim = ["cvxpy>=1.5"]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
]
dev = [
    "build>=1.0",
    "cvxpy>=1.5",
    "mypy>=1.0",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    "twine>=6.1",
]

[project.urls]
Homepage = "https://github.com/Corrram/copul"
Repository = "https://github.com/Corrram/copul"
Documentation = "https://copul.readthedocs.io"
"Issue Tracker" = "https://github.com/Corrram/copul/issues"
Changelog = "https://github.com/Corrram/copul/blob/master/CHANGELOG.md"

[dependency-groups]
# Extra tools for research scripts and notebooks
# (not needed by the package; installed by `uv sync`).
dev = [
    "jupyter>=1.0.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["copul"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = [
    "copul",
    "tests",
    "docs/source",
    "docs/requirements.txt",
    "README.md",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc", "tests/**/images"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".claude", ".git", ".venv", "build", "dist", "docs", "notes", "*.egg-info"]
addopts = "-ra -q --ignore=.claude"
log_cli = false
log_level = "INFO"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "instable: marks tests as numerically instable (deselect with '-m \"not instable\"')",
]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "notes",
    "docs",
    ".claude",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",    # long lines are handled by the formatter; formulas/docstrings may exceed
    "E731",    # lambda assignment: common for symbolic/numeric callables
    "E741",    # ambiguous names (l, I, O) are standard in the mathematics
    "B008",    # function calls in defaults (sympy symbols)
    "B028",    # warnings.warn without stacklevel
    "B905",    # zip() without strict= (py3.10 target, many internal zips)
    "SIM105",  # try/except/pass is as clear as contextlib.suppress
    "SIM102",  # nested ifs often mirror case distinctions in proofs
    "SIM108",  # ternary operators are not always clearer
    "RUF001",  # ambiguous unicode (Greek letters in strings are intended)
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
    "RUF012",  # class-level params/intervals are an intentional pattern
    "RUF059",  # unused unpacked variables document tuple structure
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = [
    "B011", "B017", "B018", "B023", "B904", "E402", "RUF043", "SIM117",
]

[tool.ruff.lint.isort]
known-first-party = ["copul"]

[tool.ruff.format]
docstring-code-format = false
